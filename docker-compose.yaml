services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: discodeit
      POSTGRES_USER: discodeit_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5433:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/discodeit
    volumes:
      - discodeit-storage:/app/.discodeit/storage
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  postgres-data:
  discodeit-storage: