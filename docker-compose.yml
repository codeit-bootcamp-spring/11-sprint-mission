services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: discodeit
      POSTGRES_USER: discodeit_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql

    ports:
      - "5433:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/discodeit
    volumes:
      - app_storage:/app/storage
    ports:
      - "8080:80"
    depends_on:
      - db
volumes:
  postgres_data:
  app_storage:

#1. 포트가 다른이유
# 같은 포트를 쓰면 포트 충돌이 난다. 근데 DB컨테이너는 APP컨테이너를 통해서만 통신이 가능하게 하고싶은데
#DB 포트를 5432를 만들어 놓으면 해킹을 당할수도 있는거 아니야? 어쨋든 문이 존재하는거잖아-> 실제 운영 환경에서는 포트
#제거해놓고 지금은실습이니까 만들어놓고 확인하려고 쓰는것이다.-> 그럼 만약에 포트를 제거해놓으면 APP이랑 DB컨테이너는 어떻게
#통신하는거야? 문이없는데? -> 도커 컴포즈 에서는 자동으로 내부 네트워크로 연결이된다.
#APP, DB볼륨은 따로 저장소를  만들어놓고 설정을 하지않아도 DB가없으면 알아서 만들어준다.
# 우리가 docker compose로 로 연결하면 한네트워크로 연결이 되기때문에 바로 서비스 이름으로 접근이 가능하다.
#jdbc:postgresql://호스트:포트/DB이름 이런형식으로 접근이 가능하다.
#compose 로 묶지 않으면 내 컴퓨터를 한번 거쳐서 돌아가야한다.

#왜 db는 depends on 이 없고 app 만잇지? -> db는 그냥 혼자서 실행이 가능한데 app은 db랑 연결되어잇어야 하기 때문이다.