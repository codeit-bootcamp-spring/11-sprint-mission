# app들을 하나의 backend_servers 그룹으로 만들어서 관리 (로드밸런서 역할)
upstream backend_servers {
  # Least Connections 전략
  # 현재 연결수가 가장 적은 서버로 전달
  # least_conn;

  # IP Hash 전략
  # 같은 클라이언트 IP는 같은 서버로 전달(hash 계산으로 나온 값이기 때문에 연결 종료 후 재연결 상관없이 항상 고정값)
  # ip_hash;

  # Weight 전략
  # replica로 하면 이름 지정 불가로 weight 전략 사용이 힘듬
  # docker-compose에서 replica로 지정하지 않고 각각 app-1: app-2: app-3: 로 서비스 생성했을 시 사용 가능
  # server app-1:80 weight=3;
  # server app-2:80 weight=5;
  # server app-2:80 weight=2;

  # 전략 생략 시 Round Robin 전략이 적용됨
  # 요청을 서버들에게 순서대로 돌아가면서 분배하는 방식
  server app:80;
}
server {
  listen 80;

  # ^~ : "/"보다 우선적용 /api/로 시작하는 요청은~
  location ^~ /api/ {
    # 요청을 Spring Boot(app의 80번 포트)로 전달
    proxy_pass http://backend_servers;

    # nginx가 실제로 어느 백엔드 서버로 전달했는지 표시
    add_header X-Upstream-Server $upstream_addr;

    # 요청의 Host 정보를 app:80에 전달(localhost:3000이면 localhost가 나옴)
    proxy_set_header Host $host;

    # 실제 클라이언트 IP를 app:80에 전달
    proxy_set_header X-Real-IP $remote_addr;

    # 클라이언트가 거쳐온 프록시 IP들(0개 이상)과 클라이언트 IP(1개)를 app:80에 전달
    # $proxy_add_x_forwarded_for : X-Forwarded-For(거쳐온 프록시 IP 주소) + $remote_addr(클라이언트 IP)
    # 여기서는 nginx -> app:80 전달이지만 client -> nginx에서 X-Forwarded-For 보내지 않았기 때문에 클라이언트 IP만 존재함
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /api/sse {
    proxy_pass http://backend_servers;
    add_header X-Upstream-Server $upstream_addr;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSE 설정
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;

    # 연결 유지 시간(30분)
    proxy_read_timeout 1800s;
    }

  location ^~ /ws/ {
    proxy_pass http://backend_servers;
    add_header X-Upstream-Server $upstream_addr;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # WebSocket 업그레이드
    # $http_upgrade는 브라우저가 핸드셰이크를 통해 websocket 값이 됨
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 명시적으로 버전 표기(WebSocket은 1.1 버전이 필요함)
    proxy_http_version 1.1;
  }

  location / {
    root /usr/share/nginx/html;

    # SPA Fallback
    # $uri $uri/ /index.html 순서대로 확인
    # $uri : 현재 요청 URI 경로가 존재하는지 확인
    # $uri/ : 현재 요청 URI 경로가 디렉토리인지 확인
    # 둘 다 존재하지 않으면 /index.html을 호출
    try_files $uri $uri/ /index.html;
  }
}