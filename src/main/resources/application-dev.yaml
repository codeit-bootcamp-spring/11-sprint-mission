server:
  port: 8080

spring:
  boot:
    admin:
      client:
        url: http://localhost:9090
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/discodeit}
    username: ${DB_USERNAME:discodeit_user}
    password: ${DB_PASSWORD:discodeit1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true
  sql:
    init:
      mode: always
      platform: postgres

discodeit:
  security:
    jwt:
      cookie-secure: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  info:
    env:
      enabled: true

logging:
  level:
    org.springframework.security: trace