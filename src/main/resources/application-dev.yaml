server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/discodeit
    username: discodeit_user
    password: discodeit1234

  # admin 설정 (비활성화)
  #  boot:
  #    admin:
  #      client:
  #        url: http://localhost:9090 # 로컬에 띄운 admin 서버 주소

logging:
  level:
    com.sprint.mission.discodeit: debug # 내가 작성한 코드만 bedug 레벨로 지정
    org.springframework.security: trace

# 개발 환경 전용 Actuator 설정
management:
  info:
    env:
      enabled: true # 개발 환경에서만 환경변수 노출 허용

# 개발 환경 전용 /actuator/info 데이터
info:
  config:
    datasource:
      url: jdbc:postgresql://localhost:5433/discodeit
      driver-class-name: org.postgresql.Driver
    jpa:
      ddl-auto: validate
    storage:
      type: local
      path: ./.storage
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB