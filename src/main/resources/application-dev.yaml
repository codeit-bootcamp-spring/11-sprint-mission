server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:discodeit;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        highlight_sql: true
  sql:
    init:
      mode: always
      platform: h2

logging:
  level:
    org.hobernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.example.discodeit: debug
