spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  boot:
    admin:
      client:
        url: http://localhost:9090

server:
  port: ${PORT:8080}

logging:
  level:
    com.sprint.mission.discodeit: info