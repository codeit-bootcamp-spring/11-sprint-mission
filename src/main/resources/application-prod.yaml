server:
  port: 80

spring:
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/discodeit}
    username: ${DB_USERNAME:discodeit_user}
    password: ${DB_PASSWORD:discodeit1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      platform: postgres

discodeit:
  security:
    jwt:
      cookie-secure: true

logging:
  level:
    root: info

    org.springframework: warn
    com.zaxxer.hikari: warn

    org.hibernate.SQL: off
    com.sprint.mission.discodeit: info

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: false