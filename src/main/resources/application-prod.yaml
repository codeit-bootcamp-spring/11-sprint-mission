server:
  port: 80
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit_1234

  jpa:
    hibernate:
      ddl-auto: validate

  logging:
    level:
      root: WARN
      com.sprint.mission.discodeit: INFO
    file:
      name: logs/discodeit.log # 운영 환경에서는 콘솔이 아닌 파일로 저장하여 휘발을 방지