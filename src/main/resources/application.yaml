spring:
  application:
    name: discodeit
  boot:
    admin:
      client:
        instance:
          name: discodeit
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  cache:
    type: redis
    cache-names:
      - channels
      - notifications
      - users
    redis:
      enable-statistics: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: discodeit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

logging:
  level:
    root: info
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

management:
  observations:
    annotations:
      enabled: true

discodeit:
  repository:
    type: jpa
    file-directory: .discodeit
  storage:
    type: local
    local:
      root-path: uploads
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:}
      secret-key: ${AWS_S3_SECRET_KEY:}
      region: ${AWS_S3_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}
  security:
    remember-me-key: ${REMEMBER_ME_KEY:discodeit-remember-me-secret}
    jwt:
      secret: ${JWT_SECRET:discodeit-jwt-secret-key-must-be-at-least-32-bytes-long}
      access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:1800}
      refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:1209600}
      max-active-count: ${JWT_MAX_ACTIVE_COUNT:1}
      cookie-secure: ${JWT_COOKIE_SECURE:true}

info:
  app:
    name: ${spring.application.name}
    version: 1.7.0
  datasource:
    url: ${spring.datasource.url}
  storage:
    type: ${discodeit.storage.type}