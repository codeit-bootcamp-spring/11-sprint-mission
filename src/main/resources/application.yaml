spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false # OSIV 비활성화

  web:
    resources:
      static-locations: classpath:/static/dist2/

discodeit:
  storage:
    type: local
    local:
      root-path: ./uploads
