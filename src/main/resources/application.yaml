spring:
  application:
    name: discodeit
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: info
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

discodeit:
  repository:
    type: jpa
    file-directory: .discodeit
  storage:
    type: local
    local:
      root-path: uploads

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  info:
    env:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.7.0
  java:
    version: 17
    spring-boot:
      version: 3.4.0