spring:
  application:
    name: discodeit
  boot:
    admin:
      client:
        instance:
          name: discodeit
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

logging:
  level:
    root: info
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

discodeit:
  repository:
    type: jpa
    file-directory: .discodeit
  storage:
    type: local
    local:
      root-path: uploads

info:
  app:
    name: ${spring.application.name}
    version: 1.7.0
  datasource:
    url: ${spring.datasource.url}
  storage:
    type: ${discodeit.storage.type}