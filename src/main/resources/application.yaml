server:
  port: ${PORT:8080}

spring:
  application:
    name: discodeit

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  sql:
    init:
      mode: always

logging:
  file:
    name: logs/app.log
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace