#spring.application.name=discodeit

discodeit:
  repository:
    type: file
    file-directory: .discodeit

  storage:
    type: local
    local:
      root-path: ./attachments/download

#logging:
#  level:
#    org.springframework: DEBUG
#    org.springdoc: DEBUG
spring:
  # To Connect Postgresql
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  # To Debug
  jpa:
    hibernate:
      ddl-auto: update # 운영때는 none으로 교체, 개발중에는 update
    show-sql: true # 실행쿼리를 확인
    properties:
      hibernate:
        format_sql: true # SQL문 가독성
        use_sql_comments: true # SQL 주석 제공
    open-in-view: false