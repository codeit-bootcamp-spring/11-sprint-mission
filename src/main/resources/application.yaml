spring:
  application:
    name: discodeit
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  observations:
    annotations:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.7.0
  java:
    version: 17
  spring-boot:
    version: 3.4.0
  datasource:
    url: ${spring.datasource.url:unknown}
    driver-class-name: ${spring.datasource.driver-class-name:unknown}
  jpa:
    ddl-auto: ${spring.jpa.hibernate.ddl-auto:unknown}
  storage:
    type: ${discodeit.storage.type:unknown}
    path: ${discodeit.storage.local.root-path:unknown}
  multipart:
    max-file-size: ${spring.servlet.multipart.max-file-size:unknown}
    max-request-size: ${spring.servlet.multipart.max-request-size:unknown}
server:
  port: 80
jwt:
  secret: ${JWT_SECRET:discodeit-jwt-secret-key-must-be-at-least-256-bits-long}
  access-token-expiration: 3600000       # 1시간 (ms)
  refresh-token-expiration: 604800000    # 7일 (ms)