#spring.application.name=discodeit

discodeit:
  repository:
    type: file
    file-directory: .discodeit

  storage:
    type: local
    local:
      root-path: ./attachments/download

spring:
  application:
    name: discodeit

  boot:
    admin:
      client:
        instance:
          name: discodeit
          service-base-url: http://localhost:8080

  profiles:
    active: dev # dev, prod test

  jpa:
    hibernate:
      ddl-auto: validate # 운영때는 none으로 교체, 개발중에는 update, 스키마 구조 변경 방어 validate

    show-sql: true # 실행쿼리를 확인
    properties:
      hibernate:
        format_sql: true # SQL문 가독성
        use_sql_comments: true # SQL 주석 제공
    open-in-view: false

logging:
  level:
    root: info

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  info:
    env:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.7.0
    java: 17
    spring-boot: 3.4.0

  jpa:
    ddl-auto: validate

  storage:
    type: local
    local:
      root-path: ./attachments/download

  multipart:
    max-file-size: 10MB
    max-request-size: 10MB