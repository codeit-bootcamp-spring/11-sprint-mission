spring:
  application:
    name: discodeit

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true




logging:
  level:
    root: INFO

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_PATH:.discodeit/storage}
    s3:
      # TODO: S3 관련 설정을 환경변수로 주입받도록 작성하세요.
      # access-key, secret-key, region, bucket은 기본값 없이 필수로 처리하세요.
      # presigned-url-expiration은 기본값을 600(초)으로 설정하세요.
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  info:
    env:
      enabled: true # info 블록의 모든 값을 보기 위한 설정

info:
  app:
    name: discodeit
    version: 1.8.0
  java:
    version: 17
  spring-boot:
    version: 3.5.11