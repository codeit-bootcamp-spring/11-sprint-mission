spring:
  application:
    name: discodeit

  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false

  sql:
    init:
      mode: always

discodeit:
  storage:
    type: local
    local:
      root-path: data/binaryContents

logging:
  level:
    root: INFO
    com.sprint.mission.discodeit: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF