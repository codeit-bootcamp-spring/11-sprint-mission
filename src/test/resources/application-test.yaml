spring:
  main:
    allow-bean-definition-overriding: true
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

discodeit:
  storage:
    type: local
    local:
      root-path: build/test-storage
  admin:
    username: admin
    email: admin@discodeit.com
    password: admin1234!
  jwt:
    secret: test-secret-key-for-discodeit-application-minimum-256-bits
    access-token-expiration: 1800000
    refresh-token-expiration: 1209600000
    max-active-jwt-count: 5

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace
