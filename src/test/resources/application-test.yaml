spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

discodeit:
  storage:
    type: local
    local:
      root-path: build/test-storage
  admin:
    username: admin
    email: admin@test.com
    password: admin1234
  jwt:
    secret: test-secret-key-for-jwt-must-be-at-least-256-bits-long-000000
    access-token-expiration: 1800000
    refresh-token-expiration: 1209600000

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace