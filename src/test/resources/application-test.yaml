spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL # 호환모드는 PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql.init.mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop # 테스트 시작 시 스키마를 새로 생성 (종료 시 제거)

    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

  logging:
    level:
      org.hibernate.SQL: DEBUG # 로그 레벨을 Debug