name: CD

on:
  push:
    branches: [ release ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_KEY}}
          aws-region: us-east-1

      - name: Login to Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{vars.ECR_REPOSITORY_URI}}:latest \
            -t ${{vars.ECR_REPOSITORY_URI}}:${{github.sha}} \
            .
          docker push ${{vars.ECR_REPOSITORY_URI}}:latest
          docker push ${{vars.ECR_REPOSITORY_URI}}:${{github.sha}}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials for ECS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_KEY}}
          aws-region: ${{vars.AWS_REGION}}

      - name: Update task definition with new image
        id: update-task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{vars.ECS_TASK_DEFINITION}} \
            --query taskDefinition > task-def.json
          
          NEW_IMAGE="${{vars.ECR_REPOSITORY_URI}}:${{github.sha}}"
          cat task-def.json | jq \
            --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status,
                  .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy)' \
            > new-task-def.json
          
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Stop current ECS service
        run: |
          aws ecs update-service \
            --cluster ${{vars.ECS_CLUSTER}} \
            --service ${{vars.ECS_SERVICE}} \
            --desired-count 0

      - name: Wait for service to stop
        run: sleep 60

      - name: Deploy new task definition to ECS
        run: |
          aws ecs update-service \
            --cluster ${{vars.ECS_CLUSTER}} \
            --service ${{vars.ECS_SERVICE}} \
            --task-definition ${{steps.update-task-def.outputs.task_def_arn}} \
            --deployment-configuration "minimumHealthyPercent=0,maximumPercent=200" \
            --desired-count 1