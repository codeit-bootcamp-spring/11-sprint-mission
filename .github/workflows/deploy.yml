name: CD

on:
  push:
    branches: [ release ]

jobs:
  # ════ Job 1: 이미지 빌드 및 ECR 푸시 ═════════════════════════
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download config files from S3
        run: |
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/application.yaml src/main/resources/application.yaml
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/config/application-prod.yaml src/main/resources/application-prod.yaml
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials (us-east-1 for Public ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push Docker image
        run: |
          IMAGE_URI=${{ vars.ECR_REPOSITORY_URI }}
          docker build -t $IMAGE_URI:latest -t $IMAGE_URI:${{ github.sha }} .
          docker push $IMAGE_URI:latest
          docker push $IMAGE_URI:${{ github.sha }}

  # ════ Job 2: ECS 서비스 업데이트 ══════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials for ECS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Register new task definition revision
        run: |
          NEW_IMAGE=${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
          ENV_FILE_ARN="arn:aws:s3:::${{ secrets.AWS_S3_BUCKET }}/config/discodeit.env"

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
            --query taskDefinition)
          NEW_TASK_DEF=$(echo $TASK_DEF \
            | jq --arg IMAGE "$NEW_IMAGE" \
                 --arg ENV_FILE_ARN "$ENV_FILE_ARN" \
              '.containerDefinitions[0].image = $IMAGE
               | .containerDefinitions[0].environmentFiles = [{"value": $ENV_FILE_ARN, "type": "s3"}]
               | del(.taskDefinitionArn, .revision, .status,
                     .requiresAttributes, .compatibilities,
                     .registeredAt, .registeredBy)')
          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "NEW_REVISION=$NEW_REVISION" >> $GITHUB_ENV

      - name: Stop existing tasks (free-tier resource)
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --desired-count 0

      - name: Deploy new task definition
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --task-definition $NEW_REVISION \
            --desired-count 1
