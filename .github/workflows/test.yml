name: Test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3 # 소스코드 가져오기

      - name: JDK 17 설정
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: .env 임시생성
        run: |
          echo "AWS_S3_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" > .env
          echo "AWS_S3_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" >> .env
          echo "AWS_S3_REGION=${{ vars.AWS_REGION }}" >> .env
          echo "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" >> .env

      - name: Gradle 권한 설정
        run: chmod +x gradlew

      - name: 테스트 및 Jacoco 테스트 커버리지 생성
        run: ./gradlew test jacocoTestReport
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: CodeCov에 테스트 커버리지 업로드
        uses: codecov/codecov-action@v5
        with:
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.CODECOV_TOKEN }}