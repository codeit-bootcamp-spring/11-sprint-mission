name: CI

on:
  pull_request:
    branches:
      - feature/global-cicd

jobs:
  test:
    name: 테스트 체크
    runs-on: ubuntu-latest

    steps:

      #코드 복사
      - uses: actions/checkout@v4

      - name: 자바 버전 셋업
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'


      - run: chmod +x gradlew
      - name: 테스트 실행
        run: ./gradlew test

      - name: Jacoco 리포트 생성
        run: ./gradlew jacocoTestReport

      - name: codecov 리포트 생성
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true