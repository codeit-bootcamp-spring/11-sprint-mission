<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멤버 대시보드</title>

    <style>
        /* 전체 배경: 은은하고 모던한 회색톤 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        /* 중앙 컨텐츠 영역 */
        .container {
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
        }

        /* 제목 스타일 */
        .page-title {
            text-align: center;
            color: #2c3e50;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        /* 개별 유저 아이템 (카드형) */
        .user-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .user-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        /* 왼쪽 그룹 */
        .user-left-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* 프로필 이미지 */
        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #e2e8f0;
            border: 2px solid #e2e8f0;
        }

        /* 정보 영역 */
        .user-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
        }

        .user-email {
            font-size: 14px;
            color: #64748b;
        }

        /* 설명글 */
        .user-description {
            font-size: 13px;
            color: #94a3b8;
            font-style: italic;
            margin-top: 2px;
        }

        /* 상태 뱃지 */
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-badge.online {
            background-color: #10b981;
            color: white;
        }

        .status-badge.offline {
            background-color: #cbd5e1;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="page-title">✨ 멤버 대시보드</h1>
    <div id="userList">
    </div>
</div>

<script>
    // ✨ 유저님이 원하시던 API 엔드포인트 세팅으로 변경 완료!
    const API_BASE_URL = '/api/v1';
    const ENDPOINTS = {
        USERS: `${API_BASE_URL}/users`,
        BINARY_CONTENT: `/api/binaryContent/find` // 슬래시 잘 들어있습니다!
    };

    // Initialize the application
    document.addEventListener('DOMContentLoaded', () => {
        fetchAndRenderUsers();
    });

    // Fetch users from the API
    async function fetchAndRenderUsers() {
        try {
            const response = await fetch(ENDPOINTS.USERS);
            if (!response.ok) throw new Error('Failed to fetch users');
            const users = await response.json();
            renderUserList(users);
        } catch (error) {
            console.error('Error fetching users:', error);
        }
    }

    // Fetch user profile image
    async function fetchUserProfile(profileId) {
        try {
            const response = await fetch(`${ENDPOINTS.BINARY_CONTENT}?binaryContentId=${profileId}`);
            if (!response.ok) throw new Error('Failed to fetch profile');
            const profile = await response.json();

            // Convert base64 encoded bytes to data URL
            return `data:${profile.contentType};base64,${profile.bytes}`;
        } catch (error) {
            console.error('Error fetching profile:', error);
            return '/default-avatar.png'; // Fallback
        }
    }

    // Render user list
    async function renderUserList(users) {
        const userListElement = document.getElementById('userList');
        userListElement.innerHTML = ''; // Clear existing content

        for (const user of users) {
            const userElement = document.createElement('div');
            userElement.className = 'user-card'; // 카드형 클래스 적용

            // Get profile image URL
            const profileUrl = user.profileId ?
                await fetchUserProfile(user.profileId) :
                '/default-avatar.png';

            // ✨ 설명글(description) 방어 로직 (null일 경우 빈 문자열 처리)
            const descHtml = user.description ? `<div class="user-description">"${user.description}"</div>` : '';

            userElement.innerHTML = `
                    <div class="user-left-group">
                        <img src="${profileUrl}" alt="${user.username}" class="user-avatar">
                        <div class="user-info">
                            <div class="user-name">${user.username}</div>
                            <div class="user-email">${user.email}</div>
                            ${descHtml}
                        </div>
                    </div>
                    <div class="status-badge ${user.online ? 'online' : 'offline'}">
                        ${user.online ? '온라인' : '오프라인'}
                    </div>
                `;

            userListElement.appendChild(userElement);
        }
    }
</script>
</body>
</html>
