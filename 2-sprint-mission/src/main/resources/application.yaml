spring:
  application:
    name: discodeit
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: discodeit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  cache:
    type: redis  # caffeine | redis
    cache-names:
      - channels
      - notifications
      - users
    caffeine:
      spec: >
        maximumSize=100,
        expireAfterAccess=600s,
        recordStats
    redis: # ← 추가
      enable-statistics: true
    data: # ← 추가
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  jpa:
    open-in-view: false # OSIV 비활성화
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  boot:
    admin:
      client:
        instance:
          name: discodeit

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,caches
  info:
    env:
      enabled: true
  observations:
    annotations:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.7.0
  java:
    version: 17
  spring-boot:
    version: 3.5.11
  config:
    datasource:
      url: ${SPRING_DATASOURCE_URL}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size}
      max-request-size: ${spring.servlet.multipart.max-request-size}

discodeit:
  repository:
    type: file
    file-directory: .discodeit

  storage:
    type: ${STORAGE_TYPE:s3} # local | s3 (기본값: local)
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}

    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)

  admin:
    username: ${DISCODEIT_ADMIN_USERNAME}
    email: ${DISCODEIT_ADMIN_EMAIL}
    password: ${DISCODEIT_ADMIN_PASSWORD}
  jwt:
    cleanup-interval: 300000 # (기본값: 5분)
    max-active-sessions: 1
    access-token:
      secret: ${JWT_ACCESS_SECRET}
      expiration: ${JWT_ACCESS_EXPIRATION:1800000} # (기본값: 30분)
    refresh-token:
      secret: ${JWT_REFRESH_SECRET}
      expiration: ${JWT_REFRESH_EXPIRATION:1209600000} # (기본값: 2주)


logging:
  level:
    root: info